<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>趣味问答｜姚理策的儿子是谁？</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#30365c;background:radial-gradient(circle at 15% 20%,#ffd7e7,transparent 40%),radial-gradient(circle at 85% 80%,#b8eaff,transparent 40%),linear-gradient(130deg,#dcd8ff,#fff5e6)}
.card{width:min(100%,470px);min-height:375px;padding:38px 24px;background:#ffffffeb;border:1px solid white;border-radius:30px;box-shadow:0 22px 70px #7672b33b;text-align:center}.pill{display:inline-block;background:#ede8ff;border-radius:99px;padding:9px 19px;color:#7866c8;font-weight:700;font-size:13px;letter-spacing:2px}h1{font-size:clamp(25px,6vw,34px);line-height:1.45;margin:26px 0 14px}p{color:#7c8399;margin:0 0 25px;line-height:1.7}.choice,.again{display:block;width:100%;cursor:pointer;font-family:inherit;text-decoration:none}.choice{position:relative;color:#373c60;font-size:19px;font-weight:700;border:2px solid #e4e0fa;background:white;border-radius:17px;padding:18px 16px;margin:14px 0}.choice:hover,.choice:focus-visible{border-color:#a79bf0;background:#f9f7ff}.choice span{position:absolute;left:16px;top:50%;transform:translateY(-50%);background:#f0ecff;border-radius:9px;padding:4px 11px;color:#8673d1}.emoji{font-size:70px;margin:20px 0 0}.again{background:#8572df;border-radius:16px;padding:17px;color:white;font-weight:700;font-size:18px;margin-top:30px}.footer{font-size:12px;color:#9b9bb1;margin-top:26px}.state{position:absolute;opacity:0;width:1px;height:1px}.page{display:none}#quiz-state:checked~main #quiz,#correct-state:checked~main #correct,#surprise-state:checked~main #surprise{display:block}
</style></head><body>
<input class="state" type="radio" name="screen" id="quiz-state" checked><input class="state" type="radio" name="screen" id="correct-state"><input class="state" type="radio" name="screen" id="surprise-state">
<main class="card"><section class="page" id="quiz"><div class="pill">✦ 趣味问答 ✦</div><h1>姚理策的儿子是谁？</h1><p>请选择你认为正确的答案</p><label class="choice" for="correct-state" tabindex="0"><span>A</span>任光耀</label><label class="choice" for="surprise-state" tabindex="0"><span>B</span>大帅比</label><div class="footer">一个小小的趣味测试 ✨</div></section>
<section class="page" id="correct"><div class="pill">✦ 答案揭晓 ✦</div><div class="emoji">🎉</div><h1>回答正确！</h1><p>恭喜你，答对啦！</p><label class="again" for="quiz-state">↻ 再玩一次</label></section>
<section class="page" id="surprise"><div class="pill">✦ 答案揭晓 ✦</div><div class="emoji">😎</div><h1>其实大帅比也是任光耀！</h1><p>没想到吧，两个选项都是他！</p><label class="again" for="quiz-state">↻ 再玩一次</label></section></main>
</body></html>
